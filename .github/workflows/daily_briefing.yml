name: GoNano Daily Competitor Intelligence Briefing

on:
  schedule:
    # 00:00 H PHT (UTC+8) corresponds to 16:00 UTC daily
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  intelligence-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scheduled Intelligence Briefing & Dispatch Email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL || 'miguel.gonzales@gonano.com' }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'joel@gonano.com, charles@gonano.com, jonathan@gonano.com' }}
          CC_EMAILS: ${{ secrets.CC_EMAILS || 'ryan@gonano.com, mathieu.vallieres@gonano.com, jason@gonano.com, alamin.abuhajjeh@gonano.com, cody.loeffler@gonano.com, john.silvernail@gonano.com' }}
          META_GRAPH_API_TOKEN: ${{ secrets.META_GRAPH_API_TOKEN }}
        run: |
          python scheduled_briefing_runner.py

      - name: Commit Updated Database & Report Logs (State Persistence)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor_store.db scheduled_briefings.log latest_scheduled_report.txt latest_scheduled_report.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily competitor intelligence briefing [skip ci]" && git push)
